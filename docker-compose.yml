services:
  codedeck-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: codedeck-bridge
    restart: unless-stopped
    networks:
      - codedeck-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      # For the entrypoint: Git identity, repositories to clone.
      - GIT_USER=${GIT_USER:-}
      - GIT_EMAIL=${GIT_EMAIL:-}
      - GIT_REPO=${GIT_REPO:-}
      # Claude Code's own settings, for an LLM gateway / router.
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=${CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY:-}
      # The DeepSeek Harness's endpoint — a DeepSeek-compatible relay or
      # gateway, unless a session is bound to a provider profile. Its key
      # travels as a secret, below.
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
      # The bridge's own settings live in ./data/config.json (created on
      # first start; config.example.json shows every key). The common ones
      # can also be set in .env: a variable set there wins over the file,
      # one left empty leaves the file's value in place.
      - CODEDECK_MACHINE_NAME=${CODEDECK_MACHINE_NAME:-}
      - CODEDECK_RELAYS=${CODEDECK_RELAYS:-}
      - CODEDECK_TOR_PROXY_URL=${CODEDECK_TOR_PROXY_URL:-}
      - CODEDECK_OPENCODE_SERVER_URL=${CODEDECK_OPENCODE_SERVER_URL:-}
      - CODEDECK_OPENCODE_PORT=${CODEDECK_OPENCODE_PORT:-}
      - CODEDECK_DEEPSEEK_PATH=${CODEDECK_DEEPSEEK_PATH:-}
      # An npm registry mirror for the agent installers (the sha512 pin still
      # applies).
      - CODEDECK_NPM_REGISTRY=${CODEDECK_NPM_REGISTRY:-}
      - CODEDECK_DIRECT_LISTEN=${CODEDECK_DIRECT_LISTEN:-}
      - CODEDECK_DIRECT_ENDPOINTS=${CODEDECK_DIRECT_ENDPOINTS:-}
      # 1 runs terminals (docs/TERMINAL.md): a shell an approved phone
      # drives. Off unless set; each phone is still approved on the machine.
      - CODEDECK_TERMINAL=${CODEDECK_TERMINAL:-}
    # The direct link: phones on your network (or VPN) reach the bridge here
    # without a relay. Only paired phones get past its handshake.
    ports:
      - "7447:7447"
    secrets:
      - source: claude_code_oauth_token
        target: claude_code_oauth_token
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: github_token
        target: github_token
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: deepseek_api_key
        target: deepseek_api_key
        uid: "1000"
        gid: "1000"
        mode: 0440
    volumes:
      - ./data:/data
      # The agents' runtimes, a cache of what the host installs on demand, in
      # a volume of Docker's own rather than in ./data: on Docker Desktop a
      # host directory is a file share slow enough to dominate a runtime of
      # hundreds of packages — the DeepSeek Harness boots in about a second
      # from a volume and in about 25 from ./data.
      - agents:/data/agents

  codedeck-tor:
    # Tor from the Tor Project's own Debian repository, rebuilt weekly. The
    # network drops clients whose Tor lacks a protocol its consensus requires,
    # so an unmaintained image stops working outright: bump this pin when Tor
    # logs "not supported by this version of Tor".
    image: ghcr.io/deymosh/tor:0.4.9.15@sha256:ecdfd26d17cfb06c614f87e00c09e5185f66e8ff4a0b9d7bbde901b61e0ffd41
    container_name: codedeck-tor
    restart: unless-stopped
    profiles:
      - tor
    networks:
      - codedeck-net
    volumes:
      - ./data/tor:/data/.tor
    command: ["--DataDirectory", "/data/.tor", "--SocksPort", "0.0.0.0:9050", "--Log", "notice stdout"]
    healthcheck:
      test: ["CMD", "timeout", "5", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/9050"]
      interval: 30s

secrets:
  claude_code_oauth_token:
    environment: CLAUDE_CODE_OAUTH_TOKEN
  github_token:
    environment: GITHUB_TOKEN
  deepseek_api_key:
    environment: DEEPSEEK_API_KEY

volumes:
  agents:

networks:
  codedeck-net:
    driver: bridge
