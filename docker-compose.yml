services:
  codedeck-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # 1 = bake the agents' binaries into the image (hosts without internet
        # access); by default they are installed into /data/agents on first use.
        BUNDLE_AGENTS: ${CODEDECK_BUNDLE_AGENTS:-0}
    container_name: codedeck-bridge
    restart: unless-stopped
    networks:
      - codedeck-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      # For the entrypoint: Git identity, repositories to clone, GSD.
      - GIT_USER=${GIT_USER:-}
      - GIT_EMAIL=${GIT_EMAIL:-}
      - GIT_REPO=${GIT_REPO:-}
      - CODEDECK_GSD_AUTO_INSTALL=${CODEDECK_GSD_AUTO_INSTALL:-}
      # Claude Code's own settings, for an LLM gateway / router.
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=${CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY:-}
      # The DeepSeek Harness's endpoint — a DeepSeek-compatible relay or
      # gateway, unless a session is bound to a provider profile. Its key
      # travels as a secret, below.
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
      # The bridge's own settings live in ./data/config.json (created on
      # first start; config.example.json shows every key). The common ones
      # can also be set in .env: a variable set there wins over the file,
      # one left empty leaves the file's value in place.
      - CODEDECK_MACHINE_NAME=${CODEDECK_MACHINE_NAME:-}
      - CODEDECK_RELAYS=${CODEDECK_RELAYS:-}
      - CODEDECK_TOR_PROXY_URL=${CODEDECK_TOR_PROXY_URL:-}
      - CODEDECK_OPENCODE_SERVER_URL=${CODEDECK_OPENCODE_SERVER_URL:-}
      - CODEDECK_OPENCODE_PORT=${CODEDECK_OPENCODE_PORT:-}
      - CODEDECK_DEEPSEEK_PATH=${CODEDECK_DEEPSEEK_PATH:-}
      - CODEDECK_DIRECT_LISTEN=${CODEDECK_DIRECT_LISTEN:-}
      - CODEDECK_DIRECT_ENDPOINTS=${CODEDECK_DIRECT_ENDPOINTS:-}
    # The direct link: phones on your network (or VPN) reach the bridge here
    # without a relay. Only paired phones get past its handshake.
    ports:
      - "7447:7447"
    secrets:
      - source: claude_code_oauth_token
        target: claude_code_oauth_token
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: github_token
        target: github_token
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: deepseek_api_key
        target: deepseek_api_key
        uid: "1000"
        gid: "1000"
        mode: 0440
    volumes:
      - ./data:/data
      # The agents' runtimes, a cache of what the host installs on demand (or
      # an image built with BUNDLE_AGENTS=1 carries), in a volume of Docker's
      # own rather than in ./data. A host directory is never filled from the
      # image, so a bundle would not reach it; and on Docker Desktop it is a
      # file share slow enough to dominate a runtime of hundreds of packages —
      # the DeepSeek Harness boots in about a second from a volume and in
      # about 25 from ./data.
      - agents:/data/agents

  codedeck-tor:
    image: lncm/tor:0.4.7.13@sha256:5a3cfb478d978feb1426ce6dca8e10906bbdd72cff94d7c0c589339f717b2503
    container_name: codedeck-tor
    restart: unless-stopped
    profiles:
      - tor
    networks:
      - codedeck-net
    volumes:
      - ./data/tor:/var/lib/tor
    command: ["--SocksPort", "0.0.0.0:9050", "--Log", "notice stdout"]

secrets:
  claude_code_oauth_token:
    environment: CLAUDE_CODE_OAUTH_TOKEN
  github_token:
    environment: GITHUB_TOKEN
  deepseek_api_key:
    environment: DEEPSEEK_API_KEY

volumes:
  agents:

networks:
  codedeck-net:
    driver: bridge
