services:
  codedeck-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: codedeck-bridge
    restart: unless-stopped
    networks:
      - codedeck-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      - GIT_USER=${GIT_USER:-}
      - GIT_EMAIL=${GIT_EMAIL:-}
      - GIT_REPO=${GIT_REPO:-}
      - CODEDECK_RELAYS=${CODEDECK_RELAYS:-}
      - CODEDECK_TOR_PROXY_URL=${CODEDECK_TOR_PROXY_URL:-}
      # LLM gateway / router (e.g. claude-code-router) instead of Anthropic
      # directly — unset (the default) means the CLI talks to Anthropic as
      # usual. See packages/core/src/sdk/facade.ts's ENABLE_GATEWAY_MODEL_DISCOVERY
      # doc comment for why the second flag exists.
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=${CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY:-}
      # OpenCode — a second, optional session backend (see docs/OPENCODE.md).
      # CODEDECK_OPENCODE_SERVER_URL points at an OpenCode server running
      # elsewhere; CODEDECK_OPENCODE_AUTO_START has this container spawn and
      # manage its own `opencode serve` instead (the external URL wins if both
      # are set). Either way, provider credentials for whatever backend
      # OpenCode is configured to use (e.g. ANTHROPIC_API_KEY, or a one-time
      # `docker compose exec codedeck-bridge opencode auth login`) are yours
      # to supply — CodeDeck+ does not manage OpenCode's own credentials.
      - CODEDECK_OPENCODE_SERVER_URL=${CODEDECK_OPENCODE_SERVER_URL:-}
      - CODEDECK_OPENCODE_AUTO_START=${CODEDECK_OPENCODE_AUTO_START:-}
      - CODEDECK_OPENCODE_PORT=${CODEDECK_OPENCODE_PORT:-}
    secrets:
      - source: claude_code_oauth_token
        target: claude_code_oauth_token
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: github_token
        target: github_token
        uid: "1000"
        gid: "1000"
        mode: 0440
    volumes:
      - ./data:/data

  # Optional bundled Tor daemon — OFF by default. Enable with:
  #   docker compose --profile tor up -d
  # or COMPOSE_PROFILES=tor in .env. If you'd rather point the bridge at an
  # existing Tor daemon (e.g. the one already running next to your CLN node)
  # instead, leave this profile disabled and set CODEDECK_TOR_PROXY_URL to
  # that daemon's reachable SocksPort — the two are mutually exclusive by
  # whatever CODEDECK_TOR_PROXY_URL points at.
  codedeck-tor:
    image: lncm/tor:0.4.7.13@sha256:5a3cfb478d978feb1426ce6dca8e10906bbdd72cff94d7c0c589339f717b2503
    container_name: codedeck-tor
    restart: unless-stopped
    profiles:
      - tor
    networks:
      - codedeck-net
    volumes:
      - ./data/tor:/var/lib/tor
    # SocksPort bound to all interfaces (the image's default torrc binds
    # 127.0.0.1, reachable only from the host) so codedeck-bridge can reach it
    # by service name on codedeck-net. No torrc file needed — Tor accepts
    # these as CLI overrides via the image's `ENTRYPOINT ["tor"]`. Tor logs a
    # "public address" warning for 0.0.0.0 — expected and safe here: this port
    # is only reachable from other containers on the codedeck-net bridge
    # network, never published to the host or the internet (no `ports:` entry).
    command: ["--SocksPort", "0.0.0.0:9050", "--Log", "notice stdout"]

secrets:
  claude_code_oauth_token:
    environment: CLAUDE_CODE_OAUTH_TOKEN
  github_token:
    environment: GITHUB_TOKEN

networks:
  codedeck-net:
    driver: bridge
