name: CI

# Skip CI for changes that cannot affect typecheck / test / build or the cargo
# job — prose, the Claude Code config, licence/ignore files. Everything else
# (source, package.json, lockfiles, tsconfig, docker/, scripts/, the workflows
# themselves) still runs. Safe because no branch protection makes `CI` a
# required status check; if that changes, a required check that never runs on a
# docs-only PR would block the merge — revisit then.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        # version is read from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke-test the bridge artifact
        run: |
          node apps/bridge/out/main.js version
          node apps/bridge/out/main.js doctor || true

  # Rust coverage for src-tauri (Marmot loopback tests + sqlstore), the
  # tauri-plugin-* crates, and the client-core / client-runtime workspace
  # (migration F1). Path-filtered so JS-only pushes stay fast.
  cargo:
    name: cargo test (src-tauri + crates, desktop target)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Detect Rust changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'apps/mobile/src-tauri/**'
              - 'apps/mobile/tauri-plugin-*/**'
            core:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              # the shared codec conformance corpus (also consumed by pnpm test)
              - 'packages/protocol/fixtures/**'

      - name: Install Tauri Linux system deps
        if: steps.filter.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install Rust
        if: steps.filter.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.rust == 'true'
        with:
          workspaces: apps/mobile/src-tauri

      - name: cargo test
        if: steps.filter.outputs.rust == 'true'
        working-directory: apps/mobile/src-tauri
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          cargo test --locked
          # F1: the in-process client-runtime binding (off by default). Build it
          # so a broken `corebridge` fails CI, not a test APK.
          cargo build --locked --features native-core

      # --- client-core / client-runtime workspace (pure Rust, no system deps) ---
      - name: Install Rust (client-core)
        if: steps.filter.outputs.core == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.core == 'true'
        with:
          workspaces: .

      - name: cargo test + clippy (crates)
        if: steps.filter.outputs.core == 'true'
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          # The Marmot engine (MDK 0.8 / MLS + SQLCipher) is behind `marmot`,
          # off for the pure-logic run above. Build + test it too so the
          # relocated engine and its `MarmotEngine` port impl fail CI here, not
          # only in the src-tauri job.
          cargo test -p client-core --features marmot --locked
          cargo clippy -p client-runtime --features marmot --all-targets --locked -- -D warnings

      - name: No Rust changes — skipped
        if: steps.filter.outputs.rust != 'true' && steps.filter.outputs.core != 'true'
        run: echo "no Rust changes; cargo job skipped."
