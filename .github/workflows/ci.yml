name: CI

# Skip CI for changes that cannot affect typecheck / test / build or the cargo
# job — prose, the Claude Code config, licence/ignore files. Everything else
# (source, package.json, lockfiles, tsconfig, docker/, scripts/, the workflows
# themselves) still runs. Safe because no branch protection makes `CI` a
# required status check; if that changes, a required check that never runs on a
# docs-only PR would block the merge — revisit then.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  # release.yml runs the whole suite before it builds anything. `full` skips
  # every path filter below: a release verifies the tagged commit, not a diff.
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

# Read-only token: nothing here writes to the repository or a registry.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Rust caches (several hundred MB per job): only `master` runs save them. A
# cache saved by a pull request is visible to that pull request alone, so it
# is dead weight once the PR merges, and filling the repository's 10 GB cache
# quota evicts the master caches every PR run restores from. The push run
# after each merge refreshes them.

jobs:
  # Which parts of the tree changed, decided once. A job whose part did not
  # change is skipped at the job level: no runner, no checkout, no toolchain.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      host: ${{ inputs.full || steps.filter.outputs.host == 'true' }}
      rust: ${{ inputs.full || steps.filter.outputs.rust == 'true' }}
      android: ${{ inputs.full || steps.filter.outputs.android == 'true' }}
      scripts: ${{ inputs.full || steps.filter.outputs.scripts == 'true' }}
      image: ${{ inputs.full || steps.filter.outputs.image == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.full }}

      - name: Detect changes
        id: filter
        if: ${{ !inputs.full }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            host:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            android:
              - 'apps/android/**'
              - 'crates/protocol/**'
              - 'crates/nostr-transport/**'
              - 'crates/client-core/**'
              - 'crates/client-runtime/**'
              - 'crates/client-ffi/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            scripts:
              - 'codedeck'
              - '**/*.sh'
              - '.github/workflows/ci.yml'
            image:
              - 'docker/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  # The agent host: the only TypeScript left (agent SDKs are JavaScript).
  agent-host:
    name: agent host — typecheck + test + build
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # version is read from "packageManager" in package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Every crate (protocol, agent-protocol, nostr-transport, bridge-core,
  # bridge-runtime, client-core, client-runtime, client-ffi), then the driver
  # protocol and the bridge end to end. One job so both halves share one
  # build and one cache: the ignored tests live in the same test binaries
  # `cargo test --workspace` just compiled.
  #
  # The driver-protocol half: the host's TypeScript types are generated from
  # crates/agent-protocol (regenerated here, failing on drift), and the real
  # host bundle is spawned and driven by the Rust codec (fake + test-mode
  # Claude Code drivers), so a TS change that emits something the Rust types
  # reject fails here. Then the whole bridge end to end: the real runtime and
  # agent host, driven by the real phone core through a loopback relay. It
  # runs on a Rust change or an agent host change; the workspace tests and
  # clippy only on a Rust change.
  rust:
    name: cargo test + clippy, driver protocol, bridge end to end
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo test + clippy (crates)
        if: needs.changes.outputs.rust == 'true'
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          # The Marmot engine (MDK 0.8 / MLS + SQLCipher) is behind `marmot`,
          # off for the pure-logic run above. Build + test it too so the
          # engine and its `MarmotEngine` port impl fail CI here.
          cargo test -p client-core --features marmot --locked
          cargo clippy -p client-runtime --features marmot --all-targets --locked -- -D warnings

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Generated TypeScript drift check
        run: |
          cargo test --locked -p agent-protocol --test gen_ts_bindings -- --ignored
          git diff --exit-code -- packages/agent-host/src/generated || {
            echo "::error::packages/agent-host/src/generated is stale — a driver-protocol type changed without regenerating it. Run: cargo test -p agent-protocol --test gen_ts_bindings -- --ignored" >&2
            exit 1
          }

      - name: Build the host and drive it from Rust
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @codedeck/agent-host run build
          cargo test --locked -p agent-protocol --test agent_host -- --ignored
          cargo test --locked -p bridge-runtime --test e2e -- --ignored

  # The bridge on Windows — what the Windows release archive ships: the crates
  # the binary is built from, the agent host's tests and bundle, and the same
  # driver-protocol and end-to-end runs as the Linux job, against the real
  # host on Windows (process spawning, paths, the bundled Claude binary).
  windows:
    name: bridge on Windows
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.host == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # Byte-exact fixtures (the protocol corpus, generated sources) must not
      # be checked out with CRLF line endings.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Agent host test + build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @codedeck/agent-host run test
          pnpm --filter @codedeck/agent-host run build

      - name: cargo test (bridge crates), driver protocol, bridge end to end
        run: |
          cargo test --locked -p protocol -p agent-protocol -p nostr-transport -p bridge-core -p bridge-runtime
          cargo test --locked -p agent-protocol --test agent_host -- --ignored
          cargo test --locked -p bridge-runtime --test e2e -- --ignored

  # apps/android: Gradle unit tests + Paparazzi screenshot verification
  # + the UniFFI Kotlin bindings drift check. The crates it watches are
  # client-ffi and everything it depends on: a client-runtime/client-core
  # change behind the `uniffi` feature can change what uniffi-bindgen
  # generates without touching crates/client-ffi or apps/android directly.
  android:
    name: Android (Gradle + Paparazzi + UniFFI bindings)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # `ubuntu-latest` runners ship with an Android SDK + cmdline-tools
      # already installed at $ANDROID_HOME (release.yml's own "Install NDK"
      # step relies on this same path) — just top up the one platform/
      # build-tools pin this project needs. No NDK here: these are plain JVM
      # unit tests (Robolectric-backed Paparazzi rendering), nothing links
      # the real cross-compiled .so. `cargo build --lib` below only needs the
      # HOST Linux cdylib for uniffi-bindgen's own metadata extraction.
      - name: Install Android SDK platform 37 / build-tools
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-37.2" "build-tools;37.0.0" >/dev/null

      # crates/client-ffi/src/lib.rs's own doc comment: the Kotlin binding
      # surface is a build artifact of uniffi-bindgen's library-mode
      # generation, never hand-edited — regenerate and fail on drift. Mirrors
      # `./codedeck gen-android-bindings` exactly.
      - name: UniFFI Kotlin bindings drift check
        run: |
          cargo build --locked -p client-ffi --lib
          cargo run --locked -p client-ffi --bin uniffi-bindgen -- \
            generate --library target/debug/libclient_ffi.so --language kotlin --no-format \
            --out-dir /tmp/uniffi-kotlin-out
          rm -rf apps/android/app/src/main/java/uniffi
          cp -r /tmp/uniffi-kotlin-out/uniffi apps/android/app/src/main/java/uniffi
          git diff --exit-code -- apps/android/app/src/main/java/uniffi || {
            echo "::error::apps/android/app/src/main/java/uniffi/** is stale — a Rust FFI type changed without regenerating it. Run: ./codedeck gen-android-bindings" >&2
            exit 1
          }

      - name: Gradle test + Paparazzi verify
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest verifyPaparazziDebug --console=plain

  # The deployment side, which no other job touches: every shell script must
  # at least parse, and the bridge image must build (never pushed here). The
  # image build compiles the whole bridge in release mode without a layer
  # cache: its Rust layer changes with nearly every crate edit, so a cache
  # would rarely hit while holding gigabytes of the cache quota.
  packaging:
    name: scripts + bridge image build
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell scripts parse
        if: needs.changes.outputs.scripts == 'true'
        run: |
          for f in codedeck $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::does not parse"; exit 1; }
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: needs.changes.outputs.image == 'true'

      - name: Build the bridge image
        if: needs.changes.outputs.image == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
