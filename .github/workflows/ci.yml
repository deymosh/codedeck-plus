name: CI

# Skip CI for changes that cannot affect typecheck / test / build or the cargo
# job — prose, the Claude Code config, licence/ignore files. Everything else
# (source, package.json, lockfiles, tsconfig, docker/, scripts/, the workflows
# themselves) still runs. Safe because no branch protection makes `CI` a
# required status check; if that changes, a required check that never runs on a
# docs-only PR would block the merge — revisit then.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        # version is read from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke-test the bridge artifact
        run: |
          node apps/bridge/out/main.js version
          node apps/bridge/out/main.js doctor || true

  # Rust coverage for the crates/* workspace (protocol, nostr-transport,
  # client-core, client-runtime, client-ffi). Path-filtered so JS-only pushes
  # stay fast. apps/mobile/src-tauri is frozen on protocol v10 and no longer
  # built here.
  cargo:
    name: cargo test + clippy (crates)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Detect Rust changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            core:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              # the shared codec conformance corpus (also consumed by pnpm test)
              - 'packages/protocol/fixtures/**'

      - name: Install Rust
        if: steps.filter.outputs.core == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.core == 'true'
        with:
          workspaces: .

      - name: cargo test + clippy (crates)
        if: steps.filter.outputs.core == 'true'
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          # The Marmot engine (MDK 0.8 / MLS + SQLCipher) is behind `marmot`,
          # off for the pure-logic run above. Build + test it too so the
          # engine and its `MarmotEngine` port impl fail CI here.
          cargo test -p client-core --features marmot --locked
          cargo clippy -p client-runtime --features marmot --all-targets --locked -- -D warnings

      - name: No Rust changes — skipped
        if: steps.filter.outputs.core != 'true'
        run: echo "no Rust changes; cargo job skipped."

  # The driver protocol between the bridge and its agent host: the host's
  # TypeScript types are generated from crates/agent-protocol (regenerated
  # here, failing on drift), and the real host bundle is spawned and driven
  # by the Rust codec (fake + test-mode Claude Code drivers), so a TS change
  # that emits something the Rust types reject fails here. Then the whole
  # bridge end to end: the real runtime and agent host, driven by the real
  # phone core through a loopback relay.
  agent-host:
    name: driver protocol + bridge end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Detect driver-protocol changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            host:
              - 'crates/**'
              - 'packages/agent-host/**'
              - 'packages/protocol/fixtures/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pnpm-lock.yaml'

      - uses: pnpm/action-setup@v6
        if: steps.filter.outputs.host == 'true'

      - uses: actions/setup-node@v5
        if: steps.filter.outputs.host == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        if: steps.filter.outputs.host == 'true'
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.host == 'true'
        with:
          workspaces: .

      - name: Generated TypeScript drift check
        if: steps.filter.outputs.host == 'true'
        run: |
          cargo test --locked -p agent-protocol --test gen_ts_bindings -- --ignored
          git diff --exit-code -- packages/agent-host/src/generated || {
            echo "::error::packages/agent-host/src/generated is stale — a driver-protocol type changed without regenerating it. Run: cargo test -p agent-protocol --test gen_ts_bindings -- --ignored" >&2
            exit 1
          }

      - name: Build the host and drive it from Rust
        if: steps.filter.outputs.host == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @codedeck/agent-host run build
          cargo test --locked -p agent-protocol --test agent_host -- --ignored
          cargo test --locked -p bridge-runtime --test e2e -- --ignored

      - name: No driver-protocol changes — skipped
        if: steps.filter.outputs.host != 'true'
        run: echo "no driver-protocol changes; agent-host job skipped."

  # apps/android (F3.3): Gradle unit tests + Paparazzi screenshot verification
  # + the UniFFI Kotlin bindings drift check. Path-filtered like the cargo job
  # above; `core` (crates/**) is included because a client-runtime/client-core
  # change behind the `uniffi` feature can change
  # what uniffi-bindgen generates without touching crates/client-ffi or
  # apps/android directly.
  android:
    name: Android (Gradle + Paparazzi + UniFFI bindings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Detect Android/client-ffi changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            android:
              - 'apps/android/**'
              - 'crates/client-ffi/**'
            core:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

      - name: Install Rust
        if: steps.filter.outputs.android == 'true' || steps.filter.outputs.core == 'true'
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.android == 'true' || steps.filter.outputs.core == 'true'
        with:
          workspaces: .

      - name: Set up JDK 21
        if: steps.filter.outputs.android == 'true' || steps.filter.outputs.core == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # `ubuntu-latest` runners ship with an Android SDK + cmdline-tools
      # already installed at $ANDROID_HOME (release.yml's own "Install NDK"
      # step relies on this same path) — just top up the one platform/
      # build-tools pin this project needs. No NDK here: these are plain JVM
      # unit tests (Robolectric-backed Paparazzi rendering), nothing links
      # the real cross-compiled .so. `cargo build --lib` below only needs the
      # HOST Linux cdylib for uniffi-bindgen's own metadata extraction.
      - name: Install Android SDK platform 37 / build-tools
        if: steps.filter.outputs.android == 'true' || steps.filter.outputs.core == 'true'
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-37.2" "build-tools;37.0.0" >/dev/null

      # crates/client-ffi/src/lib.rs's own doc comment: the Kotlin binding
      # surface is a build artifact of uniffi-bindgen's library-mode
      # generation, never hand-edited — regenerate and fail on drift. Mirrors
      # `./codedeck gen-android-bindings` exactly.
      - name: UniFFI Kotlin bindings drift check
        if: steps.filter.outputs.android == 'true' || steps.filter.outputs.core == 'true'
        run: |
          cargo build --locked -p client-ffi --lib
          cargo run --locked -p client-ffi --bin uniffi-bindgen -- \
            generate --library target/debug/libclient_ffi.so --language kotlin \
            --out-dir /tmp/uniffi-kotlin-out
          rm -rf apps/android/app/src/main/java/uniffi
          cp -r /tmp/uniffi-kotlin-out/uniffi apps/android/app/src/main/java/uniffi
          git diff --exit-code -- apps/android/app/src/main/java/uniffi || {
            echo "::error::apps/android/app/src/main/java/uniffi/** is stale — a Rust FFI type changed without regenerating it. Run: ./codedeck gen-android-bindings" >&2
            exit 1
          }

      - name: Gradle test + Paparazzi verify
        if: steps.filter.outputs.android == 'true' || steps.filter.outputs.core == 'true'
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest verifyPaparazziDebug --console=plain

      - name: No Android/client-ffi changes — skipped
        if: steps.filter.outputs.android != 'true' && steps.filter.outputs.core != 'true'
        run: echo "no Android/client-ffi changes; android job skipped."
