name: CI

# Skip CI for changes that cannot affect typecheck / test / build or the cargo
# job — prose, the Claude Code config, licence/ignore files. Everything else
# (source, package.json, lockfiles, tsconfig, docker/, scripts/, the workflows
# themselves) still runs. Safe because no branch protection makes `CI` a
# required status check; if that changes, a required check that never runs on a
# docs-only PR would block the merge — revisit then.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        # version is read from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke-test the bridge artifact
        run: |
          node apps/bridge/out/main.js version
          node apps/bridge/out/main.js doctor || true

  # Rust coverage for src-tauri (Marmot loopback tests + sqlstore), the
  # tauri-plugin-* crates, and the client-core / client-runtime workspace
  # (migration F1). Path-filtered so JS-only pushes stay fast.
  cargo:
    name: cargo test (src-tauri + crates, desktop target)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Detect Rust changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'apps/mobile/src-tauri/**'
              - 'apps/mobile/tauri-plugin-*/**'
            core:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              # the shared codec conformance corpus (also consumed by pnpm test)
              - 'packages/protocol/fixtures/**'

      # `core` (crates/**) is included here too: a View/Intent/CoreEvent field
      # change under crates/client-runtime with no apps/mobile/src-tauri edit
      # still needs the TS-bindings drift check below, which builds src-tauri.
      - name: Install Tauri Linux system deps
        if: steps.filter.outputs.rust == 'true' || steps.filter.outputs.core == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install Rust
        if: steps.filter.outputs.rust == 'true' || steps.filter.outputs.core == 'true'
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.rust == 'true' || steps.filter.outputs.core == 'true'
        with:
          workspaces: apps/mobile/src-tauri

      - name: cargo test
        if: steps.filter.outputs.rust == 'true'
        working-directory: apps/mobile/src-tauri
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          # F2b: native-core (the in-process client-runtime hosting the whole
          # bridge protocol) is a default feature now — this already covers it.
          cargo test --locked
          # `--no-default-features` has no remaining production caller but is
          # kept buildable (see [features] in Cargo.toml) — build it too so a
          # break there fails CI, not a future opt-out build.
          cargo build --locked --no-default-features

      # Rust is the source of truth for apps/mobile/src/core/
      # nativeCoreTypes.generated.ts (see gen_ts_bindings.rs's own doc
      # comment) — regenerate it and fail if the committed copy drifted.
      # Runs whenever src-tauri OR crates/** changed, since either can move
      # the exported View/Intent/CoreEvent shapes.
      - name: TS bindings drift check
        if: steps.filter.outputs.rust == 'true' || steps.filter.outputs.core == 'true'
        working-directory: apps/mobile/src-tauri
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          cargo test --locked --features native-core --test gen_ts_bindings -- --ignored
          git diff --exit-code -- ../src/core/nativeCoreTypes.generated.ts || {
            echo "::error::apps/mobile/src/core/nativeCoreTypes.generated.ts is stale — a Rust type changed without regenerating it. Run: cargo test -p codedeck-mobile --features native-core --test gen_ts_bindings -- --ignored" >&2
            exit 1
          }

      # --- client-core / client-runtime workspace (pure Rust, no system deps) ---
      - name: Install Rust (client-core)
        if: steps.filter.outputs.core == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.core == 'true'
        with:
          workspaces: .

      - name: cargo test + clippy (crates)
        if: steps.filter.outputs.core == 'true'
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          # The Marmot engine (MDK 0.8 / MLS + SQLCipher) is behind `marmot`,
          # off for the pure-logic run above. Build + test it too so the
          # relocated engine and its `MarmotEngine` port impl fail CI here, not
          # only in the src-tauri job.
          cargo test -p client-core --features marmot --locked
          cargo clippy -p client-runtime --features marmot --all-targets --locked -- -D warnings

      - name: No Rust changes — skipped
        if: steps.filter.outputs.rust != 'true' && steps.filter.outputs.core != 'true'
        run: echo "no Rust changes; cargo job skipped."

  # apps/android (F3.3): Gradle unit tests + Paparazzi screenshot verification
  # + the UniFFI Kotlin bindings drift check. Path-filtered like the cargo job
  # above, and for the same reason `core` (crates/**) is included there: a
  # client-runtime/client-core change behind the `uniffi` feature can change
  # what uniffi-bindgen generates without touching crates/uniffi-bridge or
  # apps/android directly.
  android:
    name: Android (Gradle + Paparazzi + UniFFI bindings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Detect Android/uniffi-bridge changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            android:
              - 'apps/android/**'
              - 'crates/uniffi-bridge/**'
            core:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

      - name: Install Rust
        if: steps.filter.outputs.android == 'true' || steps.filter.outputs.core == 'true'
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.android == 'true' || steps.filter.outputs.core == 'true'
        with:
          workspaces: .

      - name: Set up JDK 21
        if: steps.filter.outputs.android == 'true' || steps.filter.outputs.core == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # `ubuntu-latest` runners ship with an Android SDK + cmdline-tools
      # already installed at $ANDROID_HOME (release.yml's own "Install NDK"
      # step relies on this same path) — just top up the one platform/
      # build-tools pin this project needs. No NDK here: these are plain JVM
      # unit tests (Robolectric-backed Paparazzi rendering), nothing links
      # the real cross-compiled .so. `cargo build --lib` below only needs the
      # HOST Linux cdylib for uniffi-bindgen's own metadata extraction.
      - name: Install Android SDK platform 37 / build-tools
        if: steps.filter.outputs.android == 'true' || steps.filter.outputs.core == 'true'
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-37.2" "build-tools;37.0.0" >/dev/null

      # crates/uniffi-bridge/src/lib.rs's own doc comment: the Kotlin binding
      # surface is a build artifact of uniffi-bindgen's library-mode
      # generation, never hand-edited. Same shape as the TS bindings drift
      # check above — mirrors `./codedeck gen-android-bindings` exactly.
      - name: UniFFI Kotlin bindings drift check
        if: steps.filter.outputs.android == 'true' || steps.filter.outputs.core == 'true'
        run: |
          cargo build --locked -p uniffi-bridge --lib
          cargo run --locked -p uniffi-bridge --bin uniffi-bindgen -- \
            generate --library target/debug/libuniffi_bridge.so --language kotlin \
            --out-dir /tmp/uniffi-kotlin-out
          rm -rf apps/android/app/src/main/java/uniffi
          cp -r /tmp/uniffi-kotlin-out/uniffi apps/android/app/src/main/java/uniffi
          git diff --exit-code -- apps/android/app/src/main/java/uniffi || {
            echo "::error::apps/android/app/src/main/java/uniffi/** is stale — a Rust FFI type changed without regenerating it. Run: ./codedeck gen-android-bindings" >&2
            exit 1
          }

      - name: Gradle test + Paparazzi verify
        if: steps.filter.outputs.android == 'true' || steps.filter.outputs.core == 'true'
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest verifyPaparazziDebug --console=plain

      - name: No Android/uniffi-bridge changes — skipped
        if: steps.filter.outputs.android != 'true' && steps.filter.outputs.core != 'true'
        run: echo "no Android/uniffi-bridge changes; android job skipped."
