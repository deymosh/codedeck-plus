name: Release

# A single `vMAJOR.MINOR.PATCH` tag publishes ONE GitHub Release carrying every
# artifact of that version:
#   - the signed Android APK               (codedeck-vX.Y.Z.apk, the native app in apps/android)
#   - the bridge for Linux x86_64/aarch64  (codedeck-bridge-vX.Y.Z-linux-<arch>.tar.gz:
#                                           binary + agent host + Node — nothing to install)
#   - the bridge container image           (ghcr.io/<owner>/codedeck-plus-bridge:vX.Y.Z + :latest)
#
# A tag with a hyphen (v1.2.3-rc1) is published as a prerelease and does NOT
# move the `:latest` image tag. `workflow_dispatch` runs the same pipeline for a
# dry run / manual cut without pushing a tag.
#
# Required repository secrets for APK signing (same names as the maintainer's
# other Android project):
#   SIGNING_KEY          base64 of the release keystore (.jks/.keystore)
#   KEY_ALIAS            key alias inside that keystore
#   KEY_STORE_PASSWORD   keystore password
#   KEY_PASSWORD         key password

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and announce, e.g. v1.2.3 (defaults to the pushed tag)"
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

# Read-only by default; the two jobs that publish widen it for themselves.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      number: ${{ steps.v.outputs.number }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version }}"
          [ -n "$RAW" ] || RAW="${GITHUB_REF_NAME}"
          NUM="${RAW#v}"
          if ! printf '%s' "$NUM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$RAW' is not a vMAJOR.MINOR.PATCH[-prerelease] tag" >&2
            exit 1
          fi
          echo "version=v${NUM}" >> "$GITHUB_OUTPUT"
          echo "number=${NUM}" >> "$GITHUB_OUTPUT"
          if [[ "$NUM" == *-* || "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # The whole CI suite on the tagged commit, path filters off. Nothing is
  # built — let alone published — unless it passes: a tag on a broken
  # commit fails here instead of shipping.
  verify:
    name: Verify (full CI)
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  bridge-binary:
    name: Bridge — Linux ${{ matrix.arch }}
    needs: [meta, verify]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      # The Node bundled into the archive. Keep it in step with
      # docker/Dockerfile's NODE_IMAGE, so the image and the archives run the
      # agent host on the same runtime.
      NODE_BUNDLE_VERSION: v24.20.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Built inside an ubuntu:22.04 container on purpose: the binary then
      # links against glibc 2.35, so the archive runs on Ubuntu 22.04+ and
      # Debian 12+ instead of only the newest distros. The container image is
      # built separately (docker/Dockerfile) on its own base and carries its
      # own glibc, so it does not care.
      - name: Build the binary
        env:
          CODEDECK_VERSION: ${{ needs.meta.outputs.number }}
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e CODEDECK_VERSION -e CARGO_NET_RETRY=10 \
            ubuntu:22.04 bash -euxo pipefail -c '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates gcc libclang-dev clang >/dev/null
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
              . "$HOME/.cargo/env"
              cargo build --release --locked -p bridge-runtime
              chown --reference=/src target/release/codedeck-bridge
            '
          ./target/release/codedeck-bridge version

      # The agent host runs the agent SDKs; the SDK ships the Claude Code
      # binary for this runner's architecture, so each archive is built on
      # its own architecture.
      - name: Build and deploy the agent host
        run: |
          pnpm install --frozen-lockfile --filter @codedeck/agent-host...
          pnpm --filter @codedeck/agent-host run build
          pnpm --filter @codedeck/agent-host deploy --prod --legacy "$RUNNER_TEMP/agent-host"
          rm -rf "$RUNNER_TEMP"/agent-host/node_modules/.pnpm/@anthropic-ai+claude-agent-sdk-linux-*-musl@* \
                 "$RUNNER_TEMP"/agent-host/src "$RUNNER_TEMP"/agent-host/tsconfig.json "$RUNNER_TEMP"/agent-host/build.mjs

      - name: Package
        run: |
          NAME="codedeck-bridge-${{ needs.meta.outputs.version }}-linux-${{ matrix.arch }}"
          STAGE="$RUNNER_TEMP/$NAME"
          mkdir -p "$STAGE" dist
          cp target/release/codedeck-bridge "$STAGE/"
          mv "$RUNNER_TEMP/agent-host" "$STAGE/agent-host"
          # A node beside the binary: the archive needs nothing installed.
          case "${{ matrix.arch }}" in
            x86_64) NODE_ARCH=linux-x64 ;;
            aarch64) NODE_ARCH=linux-arm64 ;;
          esac
          NODE_DIST="node-${NODE_BUNDLE_VERSION}-${NODE_ARCH}"
          curl -fsSL -o "$RUNNER_TEMP/$NODE_DIST.tar.gz" \
            "https://nodejs.org/dist/${NODE_BUNDLE_VERSION}/$NODE_DIST.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/SHASUMS256.txt" \
            "https://nodejs.org/dist/${NODE_BUNDLE_VERSION}/SHASUMS256.txt"
          (cd "$RUNNER_TEMP" && grep " $NODE_DIST.tar.gz\$" SHASUMS256.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$NODE_DIST.tar.gz" -C "$STAGE" \
            --strip-components=2 "$NODE_DIST/bin/node"
          test -x "$STAGE/node"
          "$STAGE/codedeck-bridge" version
          "$STAGE/codedeck-bridge" status --home "$RUNNER_TEMP/smoke-home" | tee /tmp/status.txt
          ! grep -q MISSING /tmp/status.txt
          tar -C "$RUNNER_TEMP" -czf "dist/$NAME.tar.gz" "$NAME"
          ls -la dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bridge-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  bridge-image:
    name: Bridge — container image
    needs: [meta, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-bridge"
          TAGS="${IMAGE}:${{ needs.meta.outputs.version }}"
          if [ "${{ needs.meta.outputs.prerelease }}" != "true" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "list<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: CODEDECK_VERSION=${{ needs.meta.outputs.number }}
          provenance: false
        env:
          # Don't emit the auto ".dockerbuild" run artifact — the release job
          # downloads artifacts by name, and an unnamed extra one is just noise.
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false

  android-apk:
    name: Android — signed release APK
    needs: [meta, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - name: Install NDK + SDK platform
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;28.2.13676358" "platforms;android-37.2" "build-tools;37.0.0" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cross-compile the client core (aarch64)
        env:
          # Symbol tables only bloat the .so; the dynamic symbols JNA binds
          # to are kept.
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          # Same recipe as apps/android/scripts/build-apk-local.sh.
          TOOLBIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TOOLBIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOLBIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLBIN/aarch64-linux-android26-clang"
          cargo build --locked -p client-ffi --lib --target aarch64-linux-android --release
          mkdir -p apps/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libclient_ffi.so apps/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build the release APK (unsigned)
        working-directory: apps/android
        run: ./gradlew assembleRelease -PcodedeckVersion=${{ needs.meta.outputs.number }} --console=plain

      - name: Locate the unsigned APK
        run: |
          DIR=apps/android/app/build/outputs/apk/release
          if [ ! -d "$DIR" ] || [ -z "$(ls -A "$DIR"/*.apk 2>/dev/null)" ]; then
            echo "::error::no APK under $DIR — Gradle output layout may have changed" >&2
            find apps/android/app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          ls -la "$DIR"

      - name: Sign the APK
        id: sign
        # Pinned to master @ the node24 bump (r0adkll/sign-android-release#101) —
        # the `v1` tag still ships the deprecated node20 runtime and has not been
        # re-cut. SHA-pinned so the ref cannot move under us.
        uses: r0adkll/sign-android-release@d5f8436b702872ad5cdb1e6e4d5c8b983d25a997
        with:
          releaseDirectory: apps/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Size gate (a release .so was 226MB when symbols leaked)
        env:
          APK: ${{ steps.sign.outputs.signedReleaseFile }}
        run: |
          test -n "$APK" && test -f "$APK" || { echo "no signed APK from the sign step" >&2; exit 1; }
          APK_BYTES=$(stat -c%s "$APK")
          echo "APK: $APK ($((APK_BYTES / 1024 / 1024))MB)"
          SO_BYTES=$(unzip -l "$APK" | awk '/libclient_ffi\.so/ {print $1}' | head -1)
          echo ".so (uncompressed): $((SO_BYTES / 1024 / 1024))MB"
          if [ "${SO_BYTES:-0}" -gt $((50 * 1024 * 1024)) ]; then
            echo "FAIL: .so exceeds 50MB — symbols are probably not stripped" >&2
            exit 1
          fi
          if [ "$APK_BYTES" -gt $((100 * 1024 * 1024)) ]; then
            echo "FAIL: APK exceeds 100MB" >&2
            exit 1
          fi

      - name: Collect and rename
        env:
          APK: ${{ steps.sign.outputs.signedReleaseFile }}
        run: |
          mkdir -p dist
          cp "$APK" "dist/codedeck-${{ needs.meta.outputs.version }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [meta, bridge-binary, bridge-image, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Download by explicit name — a blanket download also pulls the auto
      # ".dockerbuild" run-artifact from build-push-action, and one flaky fetch
      # in that set fails the whole step.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-apk
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bridge-linux-*
          merge-multiple: true
          path: dist

      - run: ls -la dist

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: ${{ needs.meta.outputs.version }}
          draft: false
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Artifacts

            | Component | File |
            |---|---|
            | Android app (signed, aarch64) | `codedeck-${{ needs.meta.outputs.version }}.apk` |
            | Bridge for Linux x86_64 (binary + agent host + Node, self-contained) | `codedeck-bridge-${{ needs.meta.outputs.version }}-linux-x86_64.tar.gz` |
            | Bridge for Linux aarch64 (binary + agent host + Node, self-contained) | `codedeck-bridge-${{ needs.meta.outputs.version }}-linux-aarch64.tar.gz` |
            | Bridge image | `ghcr.io/${{ github.repository }}-bridge:${{ needs.meta.outputs.version }}` |

            Auto-generated changelog below.
          files: |
            dist/*.apk
            dist/*.tar.gz
