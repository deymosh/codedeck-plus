version: 2
updates:
  # The workflows pin every action to a commit SHA (a tag can be moved to
  # different code; a SHA cannot). This keeps those pins current: each bump
  # arrives as a PR that CI runs before anything uses it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
