[package]
name = "tauri-plugin-tor-proxy"
version = "0.1.0"
description = "Routes the WebView's relay traffic through Orbot's SOCKS5 proxy via androidx.webkit.ProxyController — Android only, no-op on desktop"
edition = "2021"
links = "tauri-plugin-tor-proxy"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
