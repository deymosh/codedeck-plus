[package]
name = "tauri-plugin-codedeck-stt"
version = "0.1.0"
description = "CodeDeck mic button: Android system speech recognition (RecognizerIntent), no-op elsewhere"
edition = "2021"
links = "tauri-plugin-codedeck-stt"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
