[package]
name = "client-core"
description = "CodeDeck+ shared client logic (pure). Protocol codec, crypto, reducers, stores."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "client_core"

[dependencies]
# The wire contract (codec, schemas, ranges, chunking, NIP-42/crypto
# primitives) — the single source of truth; client-core never redefines a
# wire type. See `crates/protocol`'s own doc comment for the dependency rule
# (protocol depends on nothing in this workspace, so a future Rust bridge can
# consume it too without reorganizing anything here).
protocol = { path = "../protocol" }
# NIP-44 v2 + keys. default-features = false keeps the dependency tree tight
# (it is cross-compiled into the Android .so).
nostr = { version = "0.44", default-features = false, features = ["std", "nip44"] }
thiserror = "1"
hex = "0.4"
# Already in the workspace tree via `nostr`; used for the image-upload path.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TS bindings are generated from these types, not hand-mirrored — see protocol's Cargo.toml.
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"

