[package]
name = "client-core"
description = "CodeDeck+ shared client logic (pure). Protocol codec, crypto, reducers, stores."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "client_core"

[features]
default = []
# These gate the heavy runtime pieces (MDK / SQLCipher for Marmot, nip59
# gift-wrap crypto for NIP-17) which live in `client-runtime`. The pure
# `stores::dm` / `stores::marmot` state machines here add no dependencies and
# are always compiled.
marmot = []
dm = []

[dependencies]
# NIP-44 v2 + keys, verified against this crate in the F0 uniffi probe.
# default-features = false keeps the tree tight (see spike/uniffi-binding-probe).
nostr = { version = "0.44", default-features = false, features = ["std", "nip44"] }
thiserror = "1"
hex = "0.4"
# Already in the workspace tree via `nostr`; used for the image-upload path.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
