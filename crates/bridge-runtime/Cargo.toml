[package]
name = "bridge-runtime"
description = "CodeDeck+ bridge binary (codedeck-bridge): relays, the agent host process, storage and the CLI around the bridge-core engine."
edition.workspace = true
# std's file locks (bridge.lock) need 1.89.
rust-version = "1.89"
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "codedeck-bridge"
path = "src/main.rs"

[lib]
name = "bridge_runtime"

[dependencies]
bridge-core = { path = "../bridge-core" }
protocol = { path = "../protocol" }
agent-protocol = { path = "../agent-protocol" }
nostr-transport = { path = "../nostr-transport" }
nostr = { version = "0.44", default-features = false, features = ["std", "nip44"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "process", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
hex = "0.4"
# HTTP for the few non-relay calls (provider token checks, pubkey
# registration, image downloads). rustls on ring, matching the relay
# transport. Never routed through the Tor proxy: that is for relay traffic.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "socks"] }
qrcode = { version = "0.14", default-features = false }
# Image uploads: AES-256-GCM blobs, sha256 ids, base64 chunks.
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
# The direct link server (see src/direct.rs): WebSocket over TLS with a
# self-signed certificate phones pin, on the same rustls/ring stack as the
# relay transport, or plain WebSocket on loopback behind an onion service.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Terminals (src/terminal.rs): a real pty per terminal the phone opens — a
# unix pty, ConPTY on Windows — so interactive programs behave as they do
# over ssh. The runtime owns it; the engine only decides.
portable-pty = "0.9"

# The pty's termios, to tell whether the shell is echoing what is typed
# (a password prompt): input typed with echo off is recorded as its byte
# count, never its bytes. Pinned to the nix portable-pty 0.9 builds against:
# `get_termios` returns *its* `Termios`, and a different nix would be a
# different type.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["term", "user"] }

[dev-dependencies]
tempfile = "3"
# The phone side of the end-to-end test, and the loopback relay it runs.
client-runtime = { path = "../client-runtime" }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
