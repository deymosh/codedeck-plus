[package]
name = "agent-protocol"
description = "CodeDeck+ driver protocol (pure): how the bridge talks to the agent host that runs agent SDKs."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "agent_protocol"

[dependencies]
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"

[dev-dependencies]
# Applies the serde attributes (renames, tagging, flatten) when exporting the
# TS types — only the generator test needs it.
specta-serde = "0.0.12"
