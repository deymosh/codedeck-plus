[package]
name = "tauri-plugin-background-relay"
version = "0.1.0"
description = "CodeDeck stay-connected foreground service: keeps process + radio alive while the webview owns the sockets"
edition = "2021"
links = "tauri-plugin-background-relay"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
